<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IFDA MASTER - ALGO DELIVERY</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { 
            --bg: #05070a; 
            --glass: rgba(15, 20, 28, 0.95); 
            --accent: #3b82f6; 
            --neon: #00f2ff; 
            --gold: #ffc107; 
            --text: #f8fafc;
            --border: rgba(255, 255, 255, 0.1);
            --red: #ff3333;
            --green: #00ff88;
        }

        body, html { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow-x: hidden; height: 100%; }
        
        /* SPLASH SCREEN INITIAL */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000;
            z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            animation: fadeOut 1s ease 3s forwards;
        }
        .logo-anim {
            width: 100px; height: 100px; border: 2px solid var(--neon); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            font-size: 20px; color: var(--neon); text-shadow: 0 0 10px var(--neon);
            box-shadow: 0 0 20px var(--accent); animation: pulse 1.5s infinite;
        }

        /* NAVIGATION */
        .nav-container {
            position: fixed; top: 0; width: 100%; z-index: 5000; background: var(--glass);
            backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
        }
        .nav-grid { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
        .nav-btn { padding: 15px 5px; font-size: 10px; font-weight: 600; cursor: pointer; color: #64748b; text-transform: uppercase; }
        .nav-btn.active { color: var(--neon); border-bottom: 2px solid var(--neon); }

        /* CARDS & LAYOUT */
        .glass-card {
            background: var(--glass); border: 1px solid var(--border); border-radius: 20px;
            padding: 20px; margin: 15px; backdrop-filter: blur(10px);
        }
        input, select { width: 100%; background: #000; border: 1px solid var(--border); color: var(--gold); padding: 12px; border-radius: 10px; margin-top: 10px; font-size: 12px; box-sizing: border-box; outline: none; }
        
        .action-btn {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            color: white; font-weight: bold; margin-top: 20px; cursor: pointer;
        }

        /* LIVE MONITORING SCREEN */
        #monitor-screen {
            background: #000; border-radius: 10px; padding: 10px; height: 110px; 
            font-family: 'Courier New', monospace; font-size: 9px; color: var(--neon); 
            overflow: hidden; margin-top: 15px; border: 1px solid var(--border);
        }

        /* PNL DISPLAY */
        .pnl-box { display: flex; justify-content: space-between; margin-top: 20px; text-align: center; }
        .pnl-val { font-size: 24px; font-weight: bold; margin: 5px 0; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="logo-anim">IFDA</div>
        <p style="margin-top:20px; font-size:9px; letter-spacing:3px; color:var(--accent);">SANGMELIMA SHIELD LAB</p>
    </div>

    <div class="nav-container">
        <div class="nav-grid">
            <div class="nav-btn active" onclick="showTab('dash', this)">DASHBOARD</div>
            <div class="nav-btn" onclick="showTab('config', this)">CONFIG PERP</div>
            <div class="nav-btn" onclick="showTab('support', this)">SUPPORT</div>
        </div>
    </div>

    <div style="padding-top: 70px;">
        <!-- SECTION DASHBOARD -->
        <div id="dash" class="tab-content">
            <div class="glass-card">
                <div style="display:flex; justify-content:space-between; font-size:10px;">
                    <span id="txt-status" style="color:var(--red);">● OFFLINE</span>
                    <span id="live-clock">00:00:00</span>
                </div>
                
                <div class="pnl-box">
                    <div style="flex:1;">
                        <small style="font-size:8px; color:#888;">CAPITAL</small>
                        <div id="disp-cap" class="pnl-val" style="color:var(--gold);">$0.00</div>
                    </div>
                    <div style="flex:1;">
                        <small style="font-size:8px; color:#888;">PNL LIVE</small>
                        <div id="disp-pnl" class="pnl-val" style="color:var(--text);">+$0.00</div>
                    </div>
                </div>

                <div id="monitor-screen">
                    <div id="logs">> ATTENTE INITIALISATION...</div>
                </div>
            </div>
            <div style="padding: 0 15px;">
                <button class="action-btn" style="background:var(--red);" onclick="panic()">🚨 PANIC SELL / STOP</button>
            </div>
        </div>

        <!-- SECTION CONFIG -->
        <div id="config" class="tab-content" style="display:none;">
            <div class="glass-card">
                <h3 style="color:var(--gold); margin-top:0;">API SETUP (PERPÉTUEL)</h3>
                <input type="number" id="inp-cap" placeholder="CAPITAL ALLOUÉ ($)">
                <select id="inp-ex">
                    <option value="BINGX">BINGX</option>
                    <option value="MEXC">MEXC</option>
                    <option value="BINANCE">BINANCE</option>
                </select>
                <input type="text" id="inp-key" placeholder="API KEY">
                <input type="password" id="inp-sec" placeholder="API SECRET">
                <button class="action-btn" onclick="startBot()">ACTIVER LE SNIPER M15</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:5000"; // Adresse de ton Termux

        function showTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display='none');
            document.getElementById(id).style.display='block';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        async function startBot() {
            const data = {
                ak: document.getElementById('inp-key').value,
                as: document.getElementById('inp-sec').value,
                exchange: document.getElementById('inp-ex').value,
                capital: document.getElementById('inp-cap').value
            };
            
            document.getElementById('txt-status').innerText = "● LIVE SNIPER";
            document.getElementById('txt-status').style.color = "var(--green)";
            document.getElementById('disp-cap').innerText = "$" + data.capital;
            showTab('dash', document.querySelector('.nav-btn'));
            
            // Lancement du monitoring temps réel
            setInterval(updateRealtime, 5000);
            addLog("> MOTEUR IFDA CONNECTÉ...");
        }

        async function updateRealtime() {
            try {
                const res = await fetch(`${API_URL}/status`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ak: document.getElementById('inp-key').value, as: document.getElementById('inp-sec').value, exchange: document.getElementById('inp-ex').value}) });
                const json = await res.json();
                if(json.status === "OK") {
                    document.getElementById('disp-pnl').innerText = (json.pnl >= 0 ? "+" : "") + "$" + json.pnl.toFixed(2);
                    document.getElementById('disp-pnl').style.color = json.pnl >= 0 ? "var(--green)" : "var(--red)";
                    addLog(`> SCAN M15 : ${new Date().toLocaleTimeString()} - OK`);
                }
            } catch(e) { console.log("Connexion Termux Offline"); }
        }

        function addLog(msg) {
            const l = document.getElementById('logs');
            const div = document.createElement('div');
            div.innerText = msg;
            l.prepend(div);
            if(l.childNodes.length > 7) l.lastChild.remove();
        }

        function panic() {
            fetch(`${API_URL}/execute`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({action: "PANIC_SELL"}) });
            addLog("> !!! PANIC SELL EXÉCUTÉ !!!");
        }

        setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
  </html>
