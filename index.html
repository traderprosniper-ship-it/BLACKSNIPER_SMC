<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BLACKSNIPER SMC - GLOBAL</title>
    <style>
        :root { --bg: #05070a; --neon: #00f2ff; --gold: #ffc107; --text: #f8fafc; --red: #ff3333; --green: #00ff88; --border: rgba(255, 255, 255, 0.1); }
        body, html { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        
        .top-status-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--border); }
        #clock { color: var(--gold); font-family: monospace; font-size: 14px; font-weight: bold; }
        .lang-select { background: #000; color: var(--neon); border: 1px solid var(--neon); padding: 5px; border-radius: 6px; font-size: 10px; font-weight: bold; outline: none; }

        #login-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-box { background: transparent; border: none; border-bottom: 2px solid var(--neon); color: var(--neon); font-size: 32px; text-align: center; width: 160px; outline: none; letter-spacing: 8px; margin-bottom: 20px; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(15, 20, 28, 0.98); display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--border); z-index: 5000; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { padding: 18px 2px; font-size: 9px; font-weight: bold; text-align: center; cursor: pointer; color: #64748b; text-transform: uppercase; }
        .nav-item.active { color: var(--neon); border-top: 2px solid var(--neon); }

        .content-area { height: calc(100vh - 120px); overflow-y: auto; padding: 10px; padding-bottom: 80px; }
        .glass-card { background: rgba(15, 20, 28, 0.95); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        #realtime-monitor { background: #000; border-radius: 12px; padding: 15px; height: 180px; font-family: 'Courier New', monospace; font-size: 10px; color: var(--neon); overflow-y: auto; border: 1px solid var(--border); }
        
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); border-radius: 8px; color: white; margin-top: 8px; box-sizing: border-box; }
        .budget-badge { background: rgba(0, 242, 255, 0.1); border: 1px solid var(--neon); color: var(--neon); padding: 4px 8px; border-radius: 5px; font-size: 10px; margin-top: 5px; display: inline-block; }
        .member-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div id="l-txt" style="color:var(--gold); font-weight:bold; letter-spacing:3px; margin-bottom:20px;">BLACKSNIPER ACCESS</div>
        <input type="password" id="pin-entry" class="pin-box" maxlength="6" placeholder="••••••">
        <button id="l-btn" style="width:140px; background:#3b82f6; color:white; border:none; padding:15px; border-radius:10px; font-weight:bold;" onclick="checkLogin()">UNLOCK</button>
    </div>

    <div class="top-status-bar">
        <div id="clock">00:00:00</div>
        <select id="langSwitcher" class="lang-select" onchange="translateEverything()">
            <option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="ar">🇸🇦 AR</option>
        </select>
    </div>

    <div class="content-area">
        <div id="dash" class="tab-content">
            <div class="glass-card">
                <div style="display:flex; justify-content:space-between; font-size:10px; margin-bottom:15px;">
                    <span id="st-tag" style="color:var(--red);">● ENGINE OFFLINE</span>
                    <div id="trading-limit-display" class="budget-badge">LIMIT: $25.00</div>
                </div>
                <div style="display:flex; justify-content:space-around; margin-bottom:20px; text-align:center;">
                    <div><small id="t-cap">CAPITAL</small><div id="display-cap" style="font-size:22px; color:var(--gold); font-weight:bold;">$25.00</div></div>
                    <div><small id="t-pnl">PNL LIVE</small><div id="live-pnl" style="font-size:22px; color:var(--green); font-weight:bold;">+$0.00</div></div>
                </div>
                <div id="realtime-monitor"><div id="logs">> WAITING FOR ENGINE...</div></div>
            </div>
            <button id="b-panic" onclick="panicSell()" style="width:100%; padding:16px; background:var(--red); border:none; border-radius:12px; color:white; font-weight:bold;">🚨 PANIC SELL</button>
        </div>

        <div id="macro" class="tab-content" style="display:none;">
            <div class="glass-card" style="padding:0; height: 500px;">
                <iframe src="https://sslecal2.investing.com?columns=exc_flags,exc_currency,exc_importance,exc_actual,exc_forecast,exc_previous&importance=2,3&features=datepicker,timezone&countries=25,32,6,37,7,5,22,39,14,10,35,43,56,36,110,11,26,12,4,17,38,42,15,45,72,35,43&calType=day&timeZone=58&lang=5" width="100%" height="100%" frameborder="0" allowtransparency="true"></iframe>
            </div>
        </div>

        <div id="team" class="tab-content" style="display:none;">
            <div class="glass-card">
                <h3 id="t-owner" style="color:var(--gold); margin-top:0;">FOUNDER & DEV</h3>
                <div class="member-line" style="background:rgba(255,193,7,0.1); padding:10px; border-radius:10px;">
                    <span style="font-weight:bold;">MASTER NASSER</span><span id="r-owner">Propriétaire</span>
                </div>
                <h3 id="t-leaders" style="margin-top:20px;">SHIELD LEADERS</h3>
                <div id="team-members">
                    <div class="member-line"><span>Albert</span><span>Togo</span></div>
                    <div class="member-line"><span>Marie</span><span>Guadeloupe</span></div>
                    <div class="member-line"><span>Sébastien</span><span>Bénin</span></div>
                    <div class="member-line"><span>Bertrand</span><span>Douala</span></div>
                </div>
            </div>
        </div>

        <div id="config" class="tab-content" style="display:none;">
            <div class="glass-card">
                <h3 id="t-config">API SETUP</h3>
                <select id="ex-sel">
                    <option>BINGX</option><option>OKX</option><option>BYBIT</option><option>BINANCE</option>
                </select>
                <input type="text" id="ph-api" placeholder="API KEY">
                <input type="password" id="i-sec" placeholder="SECRET KEY">
                <button id="b-save" onclick="saveSettings()" style="width:100%; padding:16px; background:#3b82f6; border:none; border-radius:12px; color:white; font-weight:bold; margin-top:10px;">CONNECT</button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" id="n-dash" onclick="setTab('dash', this)">DASH</div>
        <div class="nav-item" id="n-macro" onclick="setTab('macro', this)">MACRO</div>
        <div class="nav-item" id="n-team" onclick="setTab('team', this)">TEAM</div>
        <div class="nav-item" id="n-api" onclick="setTab('config', this)">API</div>
    </div>

    <script>
        const dict = {
            fr: { lt:"ACCÈS BLACKSNIPER", lb:"DÉVERROUILLER", nd:"DASHBOARD", nm:"MACRO", nt:"ÉQUIPE", na:"RÉGLAGES" },
            en: { lt:"BLACKSNIPER ACCESS", lb:"UNLOCK", nd:"DASHBOARD", nm:"MACRO", nt:"TEAM", na:"CONFIG" }
        };

        // --- LIAISON RÉELLE AVEC LE MOTEUR PYTHON ---
        async function syncEngineLogs() {
            const apiData = {
                exchange: document.getElementById('ex-sel').value,
                ak: document.getElementById('ph-api').value,
                as: document.getElementById('i-sec').value,
                symbol: "XAU/USDT" // Exemple pour l'Or
            };

            try {
                const response = await fetch('http://localhost:5000/live_logs', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(apiData)
                });
                const data = await response.json();
                const logs = document.getElementById('logs');
                document.getElementById('st-tag').style.color = "var(--green)";
                document.getElementById('st-tag').innerText = "● ENGINE ONLINE";
                
                data.scans.forEach(scan => {
                    const div = document.createElement('div');
                    let color = scan.signal ? "var(--gold)" : "var(--neon)";
                    div.innerHTML = `> [${data.time}] <span style="color:${color}">${scan.msg}</span>`;
                    logs.prepend(div);
                });

                if(logs.childNodes.length > 12) logs.lastChild.remove();
            } catch (e) {
                document.getElementById('st-tag').style.color = "var(--red)";
                document.getElementById('st-tag').innerText = "● ENGINE OFFLINE";
            }
        }

        async function panicSell() {
            // Envoi de la commande de clôture d'urgence au moteur
            await fetch('http://localhost:5000/execute', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action: "PANIC_SELL", exchange: document.getElementById('ex-sel').value })
            });
        }

        function checkLogin() { if(document.getElementById('pin-entry').value === "197800") document.getElementById('login-screen').style.display='none'; }
        function setTab(id, el) { document.querySelectorAll('.tab-content').forEach(t=>t.style.display='none'); document.getElementById(id).style.display='block'; document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
        
        setInterval(syncEngineLogs, 5000); // Mise à jour toutes les 5s
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
                                                                                        </html>
