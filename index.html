<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BLACKSNIPER SMC - GLOBAL CCXT</title>
    <style>
        :root { --bg: #05070a; --neon: #00f2ff; --gold: #ffc107; --text: #f8fafc; --red: #ff3333; --green: #00ff88; --border: rgba(255, 255, 255, 0.1); }
        body, html { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        
        .top-status-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--border); }
        #clock { color: var(--gold); font-family: monospace; font-size: 14px; font-weight: bold; }
        .lang-select { background: #000; color: var(--neon); border: 1px solid var(--neon); padding: 5px; border-radius: 6px; font-size: 10px; font-weight: bold; outline: none; }

        #login-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-box { background: transparent; border: none; border-bottom: 2px solid var(--neon); color: var(--neon); font-size: 32px; text-align: center; width: 160px; outline: none; letter-spacing: 8px; margin-bottom: 20px; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(15, 20, 28, 0.98); display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--border); z-index: 5000; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { padding: 18px 2px; font-size: 9px; font-weight: bold; text-align: center; cursor: pointer; color: #64748b; text-transform: uppercase; }
        .nav-item.active { color: var(--neon); border-top: 2px solid var(--neon); }

        .content-area { height: calc(100vh - 120px); overflow-y: auto; padding: 10px; padding-bottom: 80px; }
        .glass-card { background: rgba(15, 20, 28, 0.95); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        #realtime-monitor { background: #000; border-radius: 12px; padding: 15px; height: 180px; font-family: 'Courier New', monospace; font-size: 10px; color: var(--neon); overflow-y: auto; border: 1px solid var(--border); }
        
        input, select, textarea { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); border-radius: 8px; color: white; margin-top: 8px; box-sizing: border-box; font-family: inherit; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div id="l-txt" style="color:var(--gold); font-weight:bold; letter-spacing:3px; margin-bottom:20px;">ACCÈS BLACKSNIPER</div>
        <input type="password" id="pin-entry" class="pin-box" maxlength="6" placeholder="••••••">
        <button id="l-btn" style="width:140px; background:#3b82f6; color:white; border:none; padding:15px; border-radius:10px; font-weight:bold;" onclick="checkLogin()">DÉVERROUILLER</button>
    </div>

    <div class="top-status-bar">
        <div id="clock">00:00:00</div>
        <select id="langSwitcher" class="lang-select" onchange="translateEverything()">
            <option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option>
            <option value="es">🇪🇸 ES</option><option value="de">🇩🇪 DE</option><option value="ar">🇸🇦 AR</option>
        </select>
    </div>

    <div class="content-area">
        <!-- DASHBOARD -->
        <div id="dash" class="tab-content">
            <div class="glass-card">
                <div style="display:flex; justify-content:space-between; font-size:10px; margin-bottom:15px;">
                    <span id="st-tag" style="color:var(--red);">● MOTEUR HORS LIGNE</span>
                </div>
                <div style="display:flex; justify-content:space-around; margin-bottom:20px; text-align:center;">
                    <div><small id="t-cap">CAPITAL</small><div id="display-cap" style="font-size:22px; color:var(--gold); font-weight:bold;">$0.00</div></div>
                    <div><small id="t-pnl">PNL EN DIRECT</small><div id="live-pnl" style="font-size:22px; color:var(--green); font-weight:bold;">+$0.00</div></div>
                </div>
                <div id="realtime-monitor"><div id="logs">> EN ATTENTE DE CONNEXION CCXT...</div></div>
            </div>
            <button id="btn-panic" onclick="panicSell()" style="width:100%; padding:16px; background:var(--red); border:none; border-radius:12px; color:white; font-weight:bold;">🚨 VENTE DE PANIQUE</button>
        </div>

        <!-- CONFIGURATION API -->
        <div id="config" class="tab-content" style="display:none;">
            <div class="glass-card">
                <h3 id="t-config" style="color:var(--gold); margin-top:0;">ACCÈS UNIVERSEL CCXT</h3>
                
                <label id="l-ex" style="font-size:11px; color:var(--neon);">NOM DE L'ÉCHANGEUR (ex: mexc, binance...)</label>
                <input type="text" id="ex-id" placeholder="Taper le nom CCXT ici..." style="border: 1px solid var(--neon);">
                
                <input type="text" id="ph-api" placeholder="CLÉ API">
                <input type="password" id="i-sec" placeholder="CLÉ SECRÈTE">
                
                <div style="margin-top:15px; border-top:1px solid var(--border); padding-top:10px;">
                    <label id="l-cap-val" style="font-size:11px; color:var(--gold);">CAPITAL ($)</label>
                    <input type="number" id="trading-amount" placeholder="Ex: 10" oninput="document.getElementById('display-cap').innerText = '$' + this.value">
                </div>

                <div style="margin-top:15px;">
                    <label id="l-projects" style="font-size:11px; color:var(--gold);">20 PROJETS DE PRÉCISION (Séparez par des virgules)</label>
                    <textarea id="project-list" style="height:60px; font-size:10px; color:var(--neon);" placeholder="XAU/USDT, SOL/USDT..."></textarea>
                </div>

                <button id="b-save" style="width:100%; padding:16px; background:#3b82f6; border:none; border-radius:12px; color:white; font-weight:bold; margin-top:15px;">ACTIVER LE SHIELD</button>
            </div>
        </div>

        <!-- MACRO & TEAM (Vides pour l'instant) -->
        <div id="macro" class="tab-content" style="display:none;"><div class="glass-card">MACRO ENGINE</div></div>
        <div id="team" class="tab-content" style="display:none;"><div class="glass-card">TEAM MANAGEMENT</div></div>
    </div>

    <div class="nav-bar">
        <div id="nav-dash" class="nav-item active" onclick="setTab('dash', this)">TABLEAU</div>
        <div id="nav-config" class="nav-item" onclick="setTab('config', this)">API</div>
        <div id="nav-macro" class="nav-item" onclick="setTab('macro', this)">MACRO</div>
        <div id="nav-team" class="nav-item" onclick="setTab('team', this)">ÉQUIPE</div>
    </div>

    <script>
        const translations = {
            fr: {
                access: "ACCÈS BLACKSNIPER", unlock: "DÉVERROUILLER", offline: "● MOTEUR HORS LIGNE", connected: "● CCXT CONNECTÉ : ",
                capital: "CAPITAL", pnl: "PNL EN DIRECT", panic: "🚨 VENTE DE PANIQUE", config_title: "ACCÈS UNIVERSEL CCXT",
                label_exchange: "NOM DE L'ÉCHANGEUR (ex: mexc, binance...)", label_cap: "CAPITAL ($)", label_projects: "20 PROJETS DE PRÉCISION (Séparez par des virgules)",
                btn_save: "ACTIVER LE SHIELD", wait_handshake: "> EN ATTENTE DE CONNEXION CCXT...", placeholder_ex: "Taper le nom CCXT ici...",
                placeholder_api: "CLÉ API", placeholder_sec: "CLÉ SECRÈTE", nav_dash: "TABLEAU", nav_config: "API", nav_macro: "MACRO", nav_team: "ÉQUIPE"
            },
            en: {
                access: "BLACKSNIPER ACCESS", unlock: "UNLOCK", offline: "● ENGINE OFFLINE", connected: "● CCXT CONNECTED: ",
                capital: "CAPITAL", pnl: "LIVE PNL", panic: "🚨 PANIC SELL", config_title: "UNIVERSAL CCXT ACCESS",
                label_exchange: "EXCHANGE NAME (e.g. mexc, binance...)", label_cap: "CAPITAL ($)", label_projects: "20 PRECISION PROJECTS (Comma separated)",
                btn_save: "ACTIVATE SHIELD", wait_handshake: "> WAITING FOR CCXT HANDSHAKE...", placeholder_ex: "Type CCXT name here...",
                placeholder_api: "API KEY", placeholder_sec: "SECRET KEY", nav_dash: "DASH", nav_config: "API", nav_macro: "MACRO", nav_team: "TEAM"
            },
            es: {
                access: "ACCESO BLACKSNIPER", unlock: "DESBLOQUEAR", offline: "● MOTOR FUERA DE LÍNEA", connected: "● CCXT CONECTADO: ",
                capital: "CAPITAL", pnl: "PNL EN VIVO", panic: "🚨 VENTA DE PÁNICO", config_title: "ACCESO UNIVERSAL CCXT",
                label_exchange: "NOMBRE DEL INTERCAMBIO (ej: mexc...)", label_cap: "CAPITAL ($)", label_projects: "20 PROYECTOS DE PRECISIÓN (Separados por comas)",
                btn_save: "ACTIVAR SHIELD", wait_handshake: "> ESPERANDO CONEXIÓN CCXT...", placeholder_ex: "Escriba el nombre CCXT aquí...",
                placeholder_api: "CLAVE API", placeholder_sec: "CLAVE SECRETA", nav_dash: "PANEL", nav_config: "API", nav_macro: "MACRO", nav_team: "EQUIPO"
            },
            de: {
                access: "BLACKSNIPER ZUGRIFF", unlock: "ENTSPERREN", offline: "● ENGINE OFFLINE", connected: "● CCXT VERBUNDEN: ",
                capital: "KAPITAL", pnl: "LIVE PNL", panic: "🚨 PANIKVERKAUF", config_title: "UNIVERSALER CCXT ZUGRIFF",
                label_exchange: "BÖRSENNAME (z.B. mexc, binance...)", label_cap: "KAPITAL ($)", label_projects: "20 PRÄZISIONSPROJEKTE (Mit Komma trennen)",
                btn_save: "SHIELD AKTIVIEREN", wait_handshake: "> WARTE AUF CCXT-VERBINDUNG...", placeholder_ex: "CCXT-Namen hier eingeben...",
                placeholder_api: "API-SCHLÜSSEL", placeholder_sec: "GEHEIMER SCHLÜSSEL", nav_dash: "DASH", nav_config: "API", nav_macro: "MAKRO", nav_team: "TEAM"
            },
            ar: {
                access: "دخول بلاك سنايبر", unlock: "فتح القفل", offline: "● المحرك غير متصل", connected: "● متصل بـ CCXT : ",
                capital: "رأس المال", pnl: "الربح والخسارة المباشر", panic: "🚨 بيع اضطراري", config_title: "وصول CCXT العالمي",
                label_exchange: "اسم المنصة (مثال: mexc, binance...)", label_cap: "رأس المال ($)", label_projects: "20 مشروعاً دقيقاً (افصل بينها بفاصلة)",
                btn_save: "تفعيل الدرع", wait_handshake: "> في انتظار اتصال CCXT...", placeholder_ex: "اكتب اسم المنصة هنا...",
                placeholder_api: "مفتاح API", placeholder_sec: "المفتاح السري", nav_dash: "لوحة التحكم", nav_config: "الربط", nav_macro: "ماكرو", nav_team: "الفريق"
            }
        };

        function translateEverything() {
            const lang = document.getElementById('langSwitcher').value;
            const t = translations[lang];
            document.body.style.direction = (lang === 'ar') ? 'rtl' : 'ltr';
            document.getElementById('l-txt').innerText = t.access;
            document.getElementById('l-btn').innerText = t.unlock;
            document.getElementById('t-cap').innerText = t.capital;
            document.getElementById('t-pnl').innerText = t.pnl;
            document.getElementById('btn-panic').innerText = t.panic;
            document.getElementById('t-config').innerText = t.config_title;
            document.getElementById('ex-id').placeholder = t.placeholder_ex;
            document.getElementById('ph-api').placeholder = t.placeholder_api;
            document.getElementById('i-sec').placeholder = t.placeholder_sec;
            document.getElementById('b-save').innerText = t.btn_save;
            document.getElementById('l-ex').innerText = t.label_exchange;
            document.getElementById('l-cap-val').innerText = t.label_cap;
            document.getElementById('l-projects').innerText = t.label_projects;
            document.getElementById('nav-dash').innerText = t.nav_dash;
            document.getElementById('nav-config').innerText = t.nav_config;
            document.getElementById('nav-macro').innerText = t.nav_macro;
            document.getElementById('nav-team').innerText = t.nav_team;
        }

        async function syncEngineLogs() {
            const apiData = {
                exchange: document.getElementById('ex-id').value.toLowerCase(),
                ak: document.getElementById('ph-api').value,
                as: document.getElementById('i-sec').value,
                capital: document.getElementById('trading-amount').value,
                projects: document.getElementById('project-list').value
            };
            if(!apiData.exchange) return;
            try {
                const response = await fetch('http://localhost:5000/live_logs', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(apiData)
                });
                const data = await response.json();
                const logs = document.getElementById('logs');
                document.getElementById('st-tag').style.color = "var(--green)";
                document.getElementById('st-tag').innerText = translations[document.getElementById('langSwitcher').value].connected + apiData.exchange.toUpperCase();
                if(data.scans) {
                    data.scans.forEach(scan => {
                        const div = document.createElement('div');
                        div.innerHTML = `> [${data.time}] <span style="color:${scan.signal?'var(--gold)':'var(--neon)'}">${scan.msg}</span>`;
                        logs.prepend(div);
                    });
                }
                if(logs.childNodes.length > 25) logs.lastChild.remove();
            } catch (e) {
                document.getElementById('st-tag').style.color = "var(--red)";
                document.getElementById('st-tag').innerText = translations[document.getElementById('langSwitcher').value].offline;
            }
        }

        function checkLogin() { if(document.getElementById('pin-entry').value === "197800") document.getElementById('login-screen').style.display='none'; }
        function setTab(id, el) { 
            document.querySelectorAll('.tab-content').forEach(t=>t.style.display='none'); 
            document.getElementById(id).style.display='block'; 
            document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active')); 
            el.classList.add('active'); 
        }
        
        setInterval(syncEngineLogs, 5000);
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
    </html>
