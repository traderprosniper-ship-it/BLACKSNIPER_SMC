<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BLACKSNIPER SMC - CRT REAL ENGINE</title>
    <style>
        :root { --bg: #05070a; --neon: #00f2ff; --gold: #ffc107; --text: #f8fafc; --red: #ff3333; --green: #00ff88; --border: rgba(255, 255, 255, 0.1); }
        body, html { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(20px); }
        .lock-box { background: rgba(15, 20, 28, 0.95); padding: 30px; border-radius: 20px; border: 1px solid var(--neon); text-align: center; width: 80%; max-width: 300px; box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
        .key-input { width: 100%; padding: 15px; background: #000; border: 1px solid var(--neon); border-radius: 10px; color: var(--neon); text-align: center; font-size: 24px; letter-spacing: 5px; margin-top: 20px; outline: none; }

        #bg-logo { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; height: 280px; opacity: 0.08; z-index: -1; animation: orbit 20s linear infinite; }
        @keyframes orbit { from { transform: translate(-50%, -50%) rotateY(0deg); } to { transform: translate(-50%, -50%) rotateY(360deg); } }

        .top-status-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--border); }
        #clock { color: var(--gold); font-family: monospace; font-size: 14px; font-weight: bold; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(15, 20, 28, 0.98); display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--border); z-index: 5000; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { padding: 18px 2px; font-size: 8px; font-weight: bold; text-align: center; cursor: pointer; color: #64748b; text-transform: uppercase; }
        .nav-item.active { color: var(--neon); border-top: 2px solid var(--neon); }

        .content-area { height: calc(100vh - 120px); overflow-y: auto; padding: 10px; padding-bottom: 80px; }
        .glass-card { background: rgba(15, 20, 28, 0.9); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 20px; padding: 15px; margin-bottom: 15px; }
        
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); border-radius: 8px; color: white; margin-top: 8px; box-sizing: border-box; font-size: 13px; }
        .member-line { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="lock-box">
            <div style="color: var(--gold); font-size: 14px; font-weight: bold;">SANGMELIMA SHIELD</div>
            <input type="password" id="master-key" class="key-input" placeholder="••••••" maxlength="6">
            <button onclick="checkKey()" style="width: 100%; margin-top: 15px; padding: 12px; background: var(--neon); border: none; border-radius: 8px; color: #000; font-weight: bold;">ACCÈS RÉEL</button>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <div id="bg-logo"><img src="logo_3d.png" alt="LOGO" style="width:100%;"></div>
        <div class="top-status-bar"><div id="clock">00:00:00</div><div style="font-size: 10px; color: var(--neon);">BLACKSNIPER v3.5</div></div>

        <div class="content-area">
            <div id="dash" class="tab-content">
                <div class="glass-card">
                    <span id="engine-status" style="color:var(--red); font-size:10px;">● ENGINE DISCONNECTED</span>
                    <div style="display:flex; justify-content:space-around; margin:20px 0; text-align:center;">
                        <div><small>MISE FIXE</small><div id="display-cap" style="font-size:22px; color:var(--gold); font-weight:bold;">$0.00</div></div>
                        <div><small>PNL ACCUMULÉ</small><div id="live-pnl" style="font-size:22px; color:var(--green); font-weight:bold;">0.00%</div></div>
                    </div>
                    <div id="realtime-monitor" style="background:#000; height:130px; border-radius:10px; padding:10px; font-family:monospace; font-size:10px; color:var(--neon); overflow-y:auto; border: 1px solid var(--border);">
                        <div id="logs">> Prêt pour le scan...</div>
                    </div>
                </div>
                <button onclick="stopBot()" style="width:100%; padding:16px; background:var(--red); border:none; border-radius:12px; color:white; font-weight:bold;">🚨 PANIC STOP</button>
            </div>

            <div id="config" class="tab-content" style="display:none;">
                <div class="glass-card">
                    <h3 style="color:var(--gold); margin-top:0;">CONFIGURATION</h3>
                    <input type="number" id="trade-qty" placeholder="Quantité USDT (Ex: 25)">
                    <select id="ex-id" onchange="toggleP()"><option value="mexc">MEXC</option><option value="okx">OKX</option><option value="bingx">BingX</option></select>
                    <input type="text" id="api-key" placeholder="API KEY">
                    <input type="password" id="api-secret" placeholder="API SECRET">
                    <div id="p-f" style="display:none;"><input type="password" id="api-pass" placeholder="PASSPHRASE"></div>
                    <button onclick="runBot()" style="width:100%; padding:16px; background:var(--green); border:none; border-radius:12px; color:#000; font-weight:bold; margin-top:15px;">DÉMARRER LE SNIPER</button>
                </div>
            </div>

            <div id="macro" class="tab-content" style="display:none;">
                <div class="glass-card" style="height: 400px; padding: 0; overflow: hidden;">
                    <iframe src="https://sslecal2.investing.com?importance=2,3&countries=5&timeZone=58&lang=5" width="100%" height="100%" frameborder="0"></iframe>
                </div>
            </div>

            <div id="team" class="tab-content" style="display:none;">
                <div class="glass-card">
                    <h3 style="color:var(--gold); margin-top:0;">CORE TEAM</h3>
                    <div class="member-line"><span>Nasser</span><span style="color:var(--neon);">DEV</span></div>
                    <div class="member-line"><span>Bertrand</span><span style="color:var(--neon);">TECH</span></div>
                    <div class="member-line"><span>Sébastien</span><span style="color:var(--neon);">COACH</span></div>
                    <div class="member-line"><span>Franco</span><span style="color:var(--neon);">STRAT</span></div>
                </div>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-item active" onclick="setTab('dash', this)">DASH</div>
            <div class="nav-item" onclick="setTab('config', this)">AUTO</div>
            <div class="nav-item" onclick="setTab('macro', this)">NEWS</div>
            <div class="nav-item" onclick="setTab('team', this)">TEAM</div>
            <div class="nav-item" onclick="setTab('faq', this)">REG</div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:5000"; // Modifie par ton IP si besoin

        function checkKey() {
            if(document.getElementById('master-key').value === "197800") {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
            }
        }

        function toggleP() {
            const ex = document.getElementById('ex-id').value;
            document.getElementById('p-f').style.display = (ex==='okx') ? 'block' : 'none';
        }

        function runBot() {
            const data = {
                action: 'start',
                exchange: document.getElementById('ex-id').value,
                ak: document.getElementById('api-key').value,
                as: document.getElementById('api-secret').value,
                passphrase: document.getElementById('api-pass').value,
                qty: document.getElementById('trade-qty').value
            };
            fetch(`${API_URL}/toggle_bot`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) })
            .then(() => {
                document.getElementById('engine-status').style.color = "var(--green)";
                document.getElementById('engine-status').innerText = "● ENGINE ACTIVE";
                document.getElementById('display-cap').innerText = "$" + data.qty;
                setTab('dash', document.querySelector('.nav-item'));
                setInterval(sync, 3000);
            });
        }

        function sync() {
            fetch(`${API_URL}/get_status`).then(res => res.json()).then(data => {
                document.getElementById('logs').innerHTML = data.logs.map(l => `<div>> ${l}</div>`).join('');
                document.getElementById('live-pnl').innerText = data.pnl.toFixed(2) + "%";
            });
        }

        function setTab(id, el) { 
            document.querySelectorAll('.tab-content').forEach(t=>t.style.display='none'); 
            document.getElementById(id).style.display='block'; 
            document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active')); 
            el.classList.add('active'); 
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
</html>
